{% extends "core/base.html" %}
{% block title %}忘記密碼 — 智慧藥盒平台{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[70vh] px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-black text-brand">重設密碼</h1>
      <p class="text-slate-500 text-sm mt-2">輸入帳號登記的電子信箱</p>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
      <form method="post" class="space-y-5">
        {% csrf_token %}
        {% if form.email.errors %}<div class="px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{{ form.email.errors.0 }}</div>{% endif %}
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">電子信箱</label>
          <input type="email" name="email" autocomplete="email" required autofocus
                 class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand"
                 placeholder="name@example.com">
        </div>
        <button type="submit" class="w-full bg-brand text-white font-bold py-2.5 rounded-xl text-sm">寄送重設連結</button>
      </form>
    </div>
    <p class="text-center text-sm mt-5"><a href="{% url 'login' %}" class="text-brand font-semibold hover:underline">返回登入</a></p>
  </div>
</div>
{% endblock %}
