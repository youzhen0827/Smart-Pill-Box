# 依 Week12 教材的多容器模式：MySQL healthcheck → migrate 一次性容器 → Web / Agent。
name: smart-medicine-box

x-django-environment: &django-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-before-deployment}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DB_ENGINE: mysql
  DB_NAME: ${DB_NAME:-smartpillbox}
  DB_USER: ${DB_USER:-smartpill}
  DB_PASSWORD: ${DB_PASSWORD:-smartpill_dev_password}
  DB_HOST: db
  DB_PORT: "3306"
  DEVICE_API_TOKEN: ${DEVICE_API_TOKEN:-smartpill-dev-token}
  OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
  OPENFDA_TIMEOUT: ${OPENFDA_TIMEOUT:-20}
  LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://translator:5000}
  LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-智慧藥盒 <no-reply@localhost>}
  AGENT_POLL_SECONDS: ${AGENT_POLL_SECONDS:-15}
  AGENT_LLM_BACKEND: ${AGENT_LLM_BACKEND:-litert_lm}
  AGENT_MODEL_PATH: ${AGENT_MODEL_DOCKER_PATH:-/models/MiniCPM5-2B_int4.litertlm}
  AGENT_MODEL_CACHE_DIR: ${AGENT_MODEL_CACHE_DOCKER_DIR:-/models/cache}
  AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
  AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-MiniCPM5-2B}
  AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
  AGENT_LLM_TIMEOUT: ${AGENT_LLM_TIMEOUT:-120}
  AGENT_LLM_MIN_CONFIDENCE: ${AGENT_LLM_MIN_CONFIDENCE:-0.65}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  translator:
    image: libretranslate/libretranslate:v1.9.6
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,zh
      LT_DISABLE_WEB_UI: "true"
    ports:
      - "${TRANSLATOR_PORT:-5000}:5000"
    volumes:
      - translator_models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-smartpillbox}
      MYSQL_USER: ${DB_USER:-smartpill}
      MYSQL_PASSWORD: ${DB_PASSWORD:-smartpill_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_password}
      TZ: Asia/Taipei
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    build: .
    environment: *django-environment
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    environment: *django-environment
    command: >-
      sh -c "python manage.py collectstatic --noinput &&
             exec gunicorn medicine_box.wsgi:application
             --bind 0.0.0.0:8000
             --workers 1
             --timeout 180
             --access-logfile -"
    volumes:
      - ../models:/models
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      translator:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  agent:
    build: .
    restart: unless-stopped
    environment: *django-environment
    command: ["python", "manage.py", "run_medication_agent", "--interval", "15"]
    volumes:
      - ../models:/models
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 選用 profile：直接從 FDA 官方 openFDA 同步一小批真實資料，絕不建立 seed 假資料。
  # 執行：docker compose --profile dataset run --rm dataset-sync
  dataset-sync:
    profiles: ["dataset"]
    build: .
    environment: *django-environment
    command:
      [
        "python",
        "manage.py",
        "sync_openfda",
        "--drug",
        "acetaminophen",
        "--drug",
        "metformin",
        "--drug",
        "amoxicillin",
        "--limit",
        "5",
      ]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  mysql_data:
  translator_models:
