plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id("com.google.gms.google-services") version "4.4.1" apply false
}

android {
    namespace = 'com.example.smartpillbox'
    compileSdk = 34 // 建議先降至 34，36 目前過新易導致資源索引錯誤

    defaultConfig {
        vectorDrawables.useSupportLibrary = true
        applicationId = "com.example.smartpillbox"
        minSdk = 24
        targetSdk = 34
        versionCode = 8
        versionName = "2.1.8"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // 新增：關閉圖檔與資源優化，防止 AAPT2 壓縮造成 ID 錯位
    aaptOptions {
        cruncherEnabled = false
    }
}

dependencies {
    // 降級 AppCompat 與 Core-KTX 至相容性最好的穩定版本
    implementation('androidx.appcompat:appcompat:1.6.1') // 修正 1.7.1 在 API 24 的 Crash Bug
    implementation('com.google.android.material:material:1.11.0')
    implementation('androidx.constraintlayout:constraintlayout:2.1.4')
    implementation('androidx.core:core-ktx:1.12.0') // 降級以符合 AppCompat 1.6.1
    implementation('androidx.recyclerview:recyclerview:1.3.2')

    implementation('com.google.mlkit:translate:17.0.3')
    implementation('com.google.ai.edge.litertlm:litertlm-android:0.17.0')
    implementation(platform("com.google.firebase:firebase-bom:32.8.0"))
    implementation("com.google.firebase:firebase-messaging")

    testImplementation('junit:junit:4.13.2')
    androidTestImplementation('androidx.test.ext:junit:1.1.5')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.5.1')
}