plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id("com.google.gms.google-services") version "4.4.1" apply false
}

android {
    namespace = 'com.example.smartpillbox'
    compileSdk = 34 // 建議先降至 34，36 目前過新易導致資源索引錯誤

    defaultConfig {
        vectorDrawables.useSupportLibrary = true
        applicationId = "com.example.smartpillbox"
        minSdk = 24
        targetSdk = 34
        versionCode = 9
        versionName = "2.1.9"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions += "model"
    productFlavors {
        official {
            dimension = "model"
            applicationIdSuffix = ".official"
            versionNameSuffix = "-official"
            buildConfigField "String", "MODEL_FILE", '"MiniCPM5-2B_int4.litertlm"'
            buildConfigField "String", "MODEL_URL", '"https://huggingface.co/litert-community/MiniCPM5-2B/resolve/main/MiniCPM5-2B_int4.litertlm?download=true"'
            buildConfigField "String", "MODEL_DISPLAY_NAME", '"MiniCPM5-2B 官方 INT4"'
            buildConfigField "long", "MIN_MODEL_BYTES", "1400000000L"
            buildConfigField "long", "EXPECTED_MODEL_BYTES", "1550000000L"
            buildConfigField "boolean", "AUTO_DOWNLOAD_MODEL", "true"
        }
        lora {
            dimension = "model"
            applicationIdSuffix = ".lora"
            versionNameSuffix = "-lora"
            buildConfigField "String", "MODEL_FILE", '"MiniCPM5-2B_smartpill_trained_int8.litertlm"'
            buildConfigField "String", "MODEL_URL", '""'
            buildConfigField "String", "MODEL_DISPLAY_NAME", '"智慧藥盒 LoRA 訓練 INT8"'
            buildConfigField "long", "MIN_MODEL_BYTES", "2546936640L"
            buildConfigField "long", "EXPECTED_MODEL_BYTES", "2546936640L"
            buildConfigField "boolean", "AUTO_DOWNLOAD_MODEL", "false"
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
    }

    // 新增：關閉圖檔與資源優化，防止 AAPT2 壓縮造成 ID 錯位
    aaptOptions {
        cruncherEnabled = false
    }
}

dependencies {
    // 降級 AppCompat 與 Core-KTX 至相容性最好的穩定版本
    implementation('androidx.appcompat:appcompat:1.6.1') // 修正 1.7.1 在 API 24 的 Crash Bug
    implementation('com.google.android.material:material:1.11.0')
    implementation('androidx.constraintlayout:constraintlayout:2.1.4')
    implementation('androidx.core:core-ktx:1.12.0') // 降級以符合 AppCompat 1.6.1
    implementation('androidx.recyclerview:recyclerview:1.3.2')

    implementation('com.google.mlkit:translate:17.0.3')
    implementation('com.google.ai.edge.litertlm:litertlm-android:0.17.0')
    implementation(platform("com.google.firebase:firebase-bom:32.8.0"))
    implementation("com.google.firebase:firebase-messaging")

    testImplementation('junit:junit:4.13.2')
    androidTestImplementation('androidx.test.ext:junit:1.1.5')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.5.1')
}
